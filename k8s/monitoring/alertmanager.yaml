# ==================================================
# Alertmanager Configuration
# ==================================================

apiVersion: v1
kind: ConfigMap
metadata:
  name: alertmanager-config
  namespace: monitoring

data:
  alertmanager.yml: |
    global:
      resolve_timeout: 5m

    route:
      receiver: sre-runner-default
      group_by:
        - alertname
      group_wait: 10s
      group_interval: 30s
      repeat_interval: 1h

    receivers:
      - name: sre-runner-default


---

# ==================================================
# Alertmanager Deployment
# ==================================================

apiVersion: apps/v1
kind: Deployment
metadata:
  name: alertmanager-deployment
  namespace: monitoring

spec:
  replicas: 1

  selector:
    matchLabels:
      app: alertmanager

  template:
    metadata:
      labels:
        app: alertmanager

    spec:
      containers:
        - name: alertmanager
          image: prom/alertmanager:latest

          ports:
            - containerPort: 9093

          args:
            - "--config.file=/etc/alertmanager/alertmanager.yml"

          volumeMounts:
            - name: alertmanager-config
              mountPath: /etc/alertmanager
              readOnly: true

      volumes:
        - name: alertmanager-config
          configMap:
            name: alertmanager-config


---

# ==================================================
# Alertmanager Service
# ==================================================

apiVersion: v1
kind: Service
metadata:
  name: alertmanager-service
  namespace: monitoring

spec:
  selector:
    app: alertmanager

  ports:
    - protocol: TCP
      port: 9093
      targetPort: 9093

  type: NodePort
