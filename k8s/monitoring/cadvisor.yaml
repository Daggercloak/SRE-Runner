apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: cadvisor
  namespace: default
spec:
  selector:
    matchLabels:
      app: cadvisor

  template:
    metadata:
      labels:
        app: cadvisor

    spec:
      containers:
        - name: cadvisor
          image: gcr.io/cadvisor/cadvisor:latest

          ports:
            - name: metrics
              containerPort: 8080

          volumeMounts:
            - name: rootfs
              mountPath: /rootfs
              readOnly: true

            - name: var-run
              mountPath: /host/var/run
              readOnly: true

            - name: sys
              mountPath: /sys
              readOnly: true

            - name: var-lib-docker
              mountPath: /var/lib/docker
              readOnly: true

            - name: dev-disk
              mountPath: /dev/disk
              readOnly: true

      volumes:
        - name: rootfs
          hostPath:
            path: /

        - name: var-run
          hostPath:
            path: /var/run

        - name: sys
          hostPath:
            path: /sys

        - name: var-lib-docker
          hostPath:
            path: /var/lib/docker

        - name: dev-disk
          hostPath:
            path: /dev/disk

