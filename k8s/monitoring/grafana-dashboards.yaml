apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards-config
  namespace: monitoring
data:
  dashboards.yaml: |
    apiVersion: 1

    providers:
      - name: "default"
        orgId: 1
        folder: ""
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /var/lib/grafana/dashboards

  example-dashboard.json: |
    {
      "title": "Example Dashboard",
      "panels": [
        {
          "title": "CPU Usage",
          "targets": [
            {
              "expr": "sum by(job) (rate(process_cpu_seconds_total[1m]))"
            }
          ],
          "type": "timeseries"
        }
      ],
      "schemaVersion": 39,
      "version": 1
    }

