# ==================================================
# Grafana Deployment
# ==================================================

apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana-deployment
  namespace: monitoring
  labels:
    app: grafana

spec:
  replicas: 1

  selector:
    matchLabels:
      app: grafana

  template:
    metadata:
      labels:
        app: grafana

    spec:
      containers:
        - name: grafana
          image: grafana/grafana:latest

          ports:
            - containerPort: 3000

          volumeMounts:
            - name: grafana-config-datasources
              mountPath: /etc/grafana/provisioning/datasources
              readOnly: true

            - name: grafana-dashboard-provider
              mountPath: /etc/grafana/provisioning/dashboards
              readOnly: true

            - name: grafana-dashboard-files
              mountPath: /var/lib/grafana/dashboards
              readOnly: true

      volumes:
        - name: grafana-config-datasources
          configMap:
            name: grafana-datasources-config

        - name: grafana-dashboard-provider
          configMap:
            name: grafana-dashboards-config
            items:
              - key: dashboards.yaml
                path: dashboards.yaml

        - name: grafana-dashboard-files
          configMap:
            name: grafana-dashboards-config
            items:
              - key: example-dashboard.json
                path: example-dashboard.json

              - key: sre-runner-dashboard.json
                path: sre-runner-dashboard.json

              - key: golden-signals-dashboard.json
                path: golden-signals-dashboard.json


---

# ==================================================
# Grafana Service
# ==================================================

apiVersion: v1
kind: Service
metadata:
  name: grafana-service
  namespace: monitoring
  labels:
    app: grafana

spec:
  selector:
    app: grafana

  ports:
    - name: web
      protocol: TCP
      port: 3000
      targetPort: 3000

  type: NodePort


---

# ==================================================
# Grafana Datasources
# ==================================================

apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources-config
  namespace: monitoring
  labels:
    app: grafana

data:
  datasources.yaml: |
    apiVersion: 1

    datasources:
      - name: Prometheus
        uid: prometheus
        type: prometheus
        access: proxy
        url: http://prometheus-service.monitoring.svc.cluster.local:9090
        isDefault: true
        editable: true

      - name: Loki
        uid: loki
        type: loki
        access: proxy
        url: http://loki.opentelemetry.svc.cluster.local:3100
        isDefault: false
        editable: true
        jsonData:
          maxLines: 1000


---

# ==================================================
# Grafana Dashboards
# ==================================================

apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards-config
  namespace: monitoring
  labels:
    app: grafana

data:

  dashboards.yaml: |
    apiVersion: 1

    providers:
      - name: "default"
        orgId: 1
        folder: ""
        type: file
        disableDeletion: false
        editable: true
        updateIntervalSeconds: 30

        options:
          path: /var/lib/grafana/dashboards


  # ==================================================
  # Academy Example Dashboard
  # ==================================================

  example-dashboard.json: |
    {
      "id": null,
      "uid": "example-dashboard",
      "title": "Example Dashboard",
      "tags": ["sre-academy"],
      "timezone": "browser",
      "editable": true,
      "schemaVersion": 39,
      "version": 1,
      "panels": [
        {
          "id": 1,
          "title": "CPU Usage",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 24,
            "x": 0,
            "y": 0
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "expr": "sum by(job) (rate(process_cpu_seconds_total[1m]))",
              "legendFormat": "{{job}}",
              "refId": "A"
            }
          ]
        }
      ]
    }


  # ==================================================
  # SRE Runner Application Dashboard
  # ==================================================

  sre-runner-dashboard.json: |
    {
      "id": null,
      "uid": "sre-runner-dashboard",
      "title": "SRE Runner Dashboard",
      "tags": ["sre-runner", "application"],
      "timezone": "browser",
      "editable": true,
      "schemaVersion": 39,
      "version": 1,
      "panels": [
        {
          "id": 1,
          "title": "Game Active",
          "type": "stat",
          "gridPos": {
            "h": 6,
            "w": 6,
            "x": 0,
            "y": 0
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "expr": "sre_runner_game_active",
              "refId": "A"
            }
          ]
        },
        {
          "id": 2,
          "title": "Current Score",
          "type": "stat",
          "gridPos": {
            "h": 6,
            "w": 6,
            "x": 6,
            "y": 0
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "expr": "sre_runner_current_score",
              "refId": "A"
            }
          ]
        },
        {
          "id": 3,
          "title": "Current Speed",
          "type": "stat",
          "gridPos": {
            "h": 6,
            "w": 6,
            "x": 12,
            "y": 0
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "expr": "sre_runner_current_speed",
              "refId": "A"
            }
          ]
        },
        {
          "id": 4,
          "title": "Games Started",
          "type": "stat",
          "gridPos": {
            "h": 6,
            "w": 6,
            "x": 18,
            "y": 0
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "expr": "sre_runner_games_started_total",
              "refId": "A"
            }
          ]
        },
        {
          "id": 5,
          "title": "Collisions by Type",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 6
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "expr": "sre_runner_collisions_total",
              "legendFormat": "{{type}}",
              "refId": "A"
            }
          ]
        },
        {
          "id": 6,
          "title": "Obstacles Avoided by Type",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 6
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "expr": "sre_runner_obstacles_avoided_total",
              "legendFormat": "{{type}}",
              "refId": "A"
            }
          ]
        }
      ]
    }


  # ==================================================
  # SRE Runner Golden Signals Dashboard
  # ==================================================

  golden-signals-dashboard.json: |
    {
      "id": null,
      "uid": "sre-runner-golden-signals",
      "title": "SRE Runner - Golden Signals",
      "tags": [
        "sre-runner",
        "golden-signals",
        "observability"
      ],
      "timezone": "browser",
      "editable": true,
      "schemaVersion": 39,
      "version": 1,
      "panels": [

        {
          "id": 1,
          "title": "LATENCY - SRE Runner Span Latency",
          "description": "Average duration of instrumented SRE Runner spans in milliseconds.",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 24,
            "x": 0,
            "y": 0
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "ms"
            },
            "overrides": []
          },
          "targets": [
            {
              "expr": "sum by (span_name) (otel_collector_span_metrics_duration_milliseconds_sum{service_name=\"sre-runner\"}) / sum by (span_name) (otel_collector_span_metrics_duration_milliseconds_count{service_name=\"sre-runner\"})",
              "legendFormat": "{{span_name}}",
              "refId": "A"
            }
          ]
        },

        {
          "id": 2,
          "title": "TRAFFIC - SRE Runner Operations Observed",
          "description": "Trace-derived operation counts grouped by span name.",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "expr": "sum by (span_name) (otel_collector_span_metrics_calls_total{service_name=\"sre-runner\"})",
              "legendFormat": "{{span_name}}",
              "refId": "A"
            }
          ]
        },

        {
          "id": 3,
          "title": "TRAFFIC - Kubernetes Network I/O",
          "description": "Network receive and transmit throughput for Kubernetes workloads.",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "Bps"
            },
            "overrides": []
          },
          "targets": [
            {
              "expr": "sum(rate(container_network_receive_bytes_total{job=\"cadvisor\",id=~\"/kubepods.*\"}[5m]))",
              "legendFormat": "Receive",
              "refId": "A"
            },
            {
              "expr": "sum(rate(container_network_transmit_bytes_total{job=\"cadvisor\",id=~\"/kubepods.*\"}[5m]))",
              "legendFormat": "Transmit",
              "refId": "B"
            }
          ]
        },

        {
          "id": 4,
          "title": "ERRORS - Trace Errors",
          "description": "OpenTelemetry spans marked with error status.",
          "type": "stat",
          "gridPos": {
            "h": 6,
            "w": 6,
            "x": 0,
            "y": 16
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "expr": "sum(otel_collector_span_metrics_calls_total{service_name=\"sre-runner\",status_code=\"STATUS_CODE_ERROR\"})",
              "refId": "A"
            }
          ]
        },

        {
          "id": 5,
          "title": "ERRORS - Game Collisions",
          "description": "Total SRE Runner collisions observed by application instrumentation.",
          "type": "stat",
          "gridPos": {
            "h": 6,
            "w": 6,
            "x": 6,
            "y": 16
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "expr": "sum(sre_runner_collisions_total)",
              "refId": "A"
            }
          ]
        },

        {
          "id": 6,
          "title": "SATURATION - Kubernetes Workload CPU",
          "description": "CPU usage rate across Kubernetes workload cgroups exposed by cAdvisor.",
          "type": "gauge",
          "gridPos": {
            "h": 6,
            "w": 6,
            "x": 12,
            "y": 16
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "cores",
              "min": 0
            },
            "overrides": []
          },
          "targets": [
            {
              "expr": "sum(rate(container_cpu_usage_seconds_total{job=\"cadvisor\",id=~\"/kubepods.*\"}[5m]))",
              "refId": "A"
            }
          ]
        },

        {
          "id": 7,
          "title": "SATURATION - Kubernetes Workload Memory",
          "description": "Memory currently used across Kubernetes workload cgroups exposed by cAdvisor.",
          "type": "gauge",
          "gridPos": {
            "h": 6,
            "w": 6,
            "x": 18,
            "y": 16
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "bytes",
              "min": 0
            },
            "overrides": []
          },
          "targets": [
            {
              "expr": "sum(container_memory_usage_bytes{job=\"cadvisor\",id=~\"/kubepods.*\"})",
              "refId": "A"
            }
          ]
        },

        {
          "id": 8,
          "title": "ERRORS - SRE Runner Collision Logs",
          "description": "Application collision logs collected via OpenTelemetry and stored in Loki.",
          "type": "logs",
          "gridPos": {
            "h": 10,
            "w": 24,
            "x": 0,
            "y": 22
          },
          "datasource": {
            "type": "loki",
            "uid": "loki"
          },
          "targets": [
            {
              "expr": "{service_name=\"sre-runner\"} |= \"Collision\"",
              "refId": "A"
            }
          ],
          "options": {
            "showTime": true,
            "showLabels": false,
            "showCommonLabels": false,
            "wrapLogMessage": true,
            "prettifyLogMessage": false,
            "enableLogDetails": true,
            "dedupStrategy": "none",
            "sortOrder": "Descending"
          }
        }

      ]
    }
