apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: monitoring
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s

    scrape_configs:
      - job_name: "sre-runner"

        static_configs:
          - targets:
              - "sre-runner.default.svc.cluster.local:9090"

        metrics_path: /metrics
