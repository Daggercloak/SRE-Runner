apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: prometheus-pod-reader-cluster

rules:
  - apiGroups:
      - ""
    resources:
      - pods
      - endpoints
      - services
    verbs:
      - get
      - list
      - watch

---

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: prometheus-pod-reader-binding-cluster

subjects:
  - kind: ServiceAccount
    name: default
    namespace: monitoring

roleRef:
  kind: ClusterRole
  name: prometheus-pod-reader-cluster
  apiGroup: rbac.authorization.k8s.io

