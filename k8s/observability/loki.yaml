# ==================================================
# Loki Configuration
# ==================================================

apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-config
  namespace: opentelemetry

data:
  loki.yaml: |
    auth_enabled: false

    server:
      http_listen_port: 3100

    common:
      path_prefix: /tmp/loki

      storage:
        filesystem:
          chunks_directory: /tmp/loki/chunks
          rules_directory: /tmp/loki/rules

      replication_factor: 1

      ring:
        instance_addr: 127.0.0.1
        kvstore:
          store: inmemory

    schema_config:
      configs:
        - from: 2024-01-01
          store: tsdb
          object_store: filesystem
          schema: v13
          index:
            prefix: index_
            period: 24h

    limits_config:
      allow_structured_metadata: true

---

# ==================================================
# Loki Deployment
# ==================================================

apiVersion: apps/v1
kind: Deployment
metadata:
  name: loki
  namespace: opentelemetry

spec:
  replicas: 1

  selector:
    matchLabels:
      app: loki

  template:
    metadata:
      labels:
        app: loki

    spec:
      containers:
        - name: loki
          image: grafana/loki:3.2.1

          args:
            - "-config.file=/etc/loki/loki.yaml"

          ports:
            - name: http
              containerPort: 3100

          volumeMounts:
            - name: loki-config
              mountPath: /etc/loki/loki.yaml
              subPath: loki.yaml
              readOnly: true

      volumes:
        - name: loki-config
          configMap:
            name: loki-config

---

# ==================================================
# Loki Service
# ==================================================

apiVersion: v1
kind: Service
metadata:
  name: loki
  namespace: opentelemetry

spec:
  selector:
    app: loki

  ports:
    - name: http
      protocol: TCP
      port: 3100
      targetPort: 3100

  type: ClusterIP

