# ==================================================
# OpenTelemetry Collector Configuration
# ==================================================

apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-config
  namespace: opentelemetry

data:
  config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317

    processors:
      batch: {}

    exporters:
      debug: {}

      otlp/jaeger:
        endpoint: "jaeger-service.opentelemetry.svc.cluster.local:4317"
        tls:
          insecure: true

      prometheus:
        endpoint: "0.0.0.0:9464"
        namespace: "otel_collector"

      otlphttp/loki:
        endpoint: "http://loki.opentelemetry.svc.cluster.local:3100/otlp"
        tls:
          insecure: true

    connectors:
      spanmetrics:
        namespace: "span.metrics"

    service:
      pipelines:

        traces:
          receivers:
            - otlp
          processors:
            - batch
          exporters:
            - debug
            - otlp/jaeger
            - spanmetrics

        metrics:
          receivers:
            - spanmetrics
          processors:
            - batch
          exporters:
            - debug
            - prometheus

        logs:
          receivers:
            - otlp
          processors:
            - batch
          exporters:
            - debug
            - otlphttp/loki

---

# ==================================================
# OpenTelemetry Collector Deployment
# ==================================================

apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-collector
  namespace: opentelemetry

spec:
  replicas: 1

  selector:
    matchLabels:
      app: otel-collector

  template:
    metadata:
      labels:
        app: otel-collector

    spec:
      containers:
        - name: otel-collector
          image: otel/opentelemetry-collector-contrib:0.111.0

          args:
            - "--config=/etc/otel-collector-config.yaml"

          ports:
            - name: otlp-grpc
              containerPort: 4317

            - name: prometheus
              containerPort: 9464

          volumeMounts:
            - name: otel-config
              mountPath: /etc/otel-collector-config.yaml
              subPath: config.yaml
              readOnly: true

      volumes:
        - name: otel-config
          configMap:
            name: otel-config

---

# ==================================================
# OpenTelemetry Collector Service
# ==================================================

apiVersion: v1
kind: Service
metadata:
  name: otel-collector
  namespace: opentelemetry

spec:
  selector:
    app: otel-collector

  ports:
    - name: otlp-grpc
      protocol: TCP
      port: 4317
      targetPort: 4317

    - name: prometheus
      protocol: TCP
      port: 9464
      targetPort: 9464

  type: ClusterIP
